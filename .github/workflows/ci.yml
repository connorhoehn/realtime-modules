name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout credential is scoped to this repo and would override the
          # dependency token in the rewritten github: URLs (npm ci "Repository not found").
          persist-credentials: false
      # The github: dependencies (distributed-core, service-runtime, ...) are private
      # repositories. The workflow token only reads this repository, so a personal
      # access token with read access to the dependency repositories is required:
      # a classic PAT with the `repo` scope from an account that can read them,
      # stored as the GH_PACKAGES_TOKEN secret (repository or organisation level).
      - name: "Check the dependency token"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not set. npm ci cannot fetch the private github: dependencies without it. Create a PAT with read access to the connorhoehn dependency repositories and add it as a repository secret named GH_PACKAGES_TOKEN."
            exit 1
          fi
      - name: "Let npm fetch github: dependencies"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The token is needed only to fetch the github: dependencies. Remove the
      # rewritten URLs (they embed it) right after the install, whatever its
      # outcome, so the typecheck, the build, the tests and any later
      # dependency script cannot read the token from the global git config.
      - name: "Remove the dependency token from git config"
        if: always()
        run: |
          sections=$(git config --global --name-only --get-regexp '^url\..*\.insteadof$' | sed 's/\.insteadof$//' | sort -u || true)
          while IFS= read -r section; do
            if [ -n "$section" ]; then git config --global --remove-section "$section"; fi
          done <<< "$sections"
          if git config --global --get-regexp '^url\.' >/dev/null; then
            echo "::error::url rewrites are still in the global git config"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      # build runs verify:exports, which includes verify:browser-safe: every
      # client-facing subpath must bundle for the browser without Node imports.
      - name: Build and verify exports (browser-safe guard)
        run: npm run build
      - name: Browser-safe client entries
        run: npm run verify:browser-safe
      - name: Test
        run: npm test
