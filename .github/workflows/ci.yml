name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # GH_PACKAGES_TOKEN is a fine-grained PAT with contents:read on the
      # dependency repos. It is only needed while those repos are private;
      # without it the step falls back to the workflow token.
      - name: "Let npm fetch github: dependencies"
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN || github.token }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN || github.token }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
